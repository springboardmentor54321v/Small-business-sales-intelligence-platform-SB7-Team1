name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, ai]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        if: matrix.service != 'frontend'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Node.js
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Lint backend
        if: matrix.service == 'backend'
        run: |
          python -m pip install --upgrade pip flake8
          python -m flake8 Backend_Databse --count --exit-zero || true

      - name: Lint frontend
        if: matrix.service == 'frontend'
        working-directory: Frontend
        run: |
          npm install --no-audit --no-fund
          npx --yes eslint@8.57.0 . --ext .js,.jsx --no-error-on-unmatched-pattern --parser-options '{"ecmaVersion":2020,"sourceType":"module","ecmaFeatures":{"jsx":true}}' || true

      - name: Lint AI service
        if: matrix.service == 'ai'
        run: |
          python -m pip install --upgrade pip flake8
          python -m flake8 AIML --count --exit-zero || true

      - name: Build Docker image
        run: |
          docker build -f Devops_Integration/Dockerfile.${{ matrix.service }} -t sb7-${{ matrix.service }} .
